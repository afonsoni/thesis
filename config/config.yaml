# Main configuration file for the RAG system

# Data paths
paths:
  raw_data: "data/0_raw"
  markdown_data: "data/1_markdown"
  processed_data: "data/2_processed"

# PDF extraction settings
pdf_extraction:
  tool: "marker" # marker or pymupdf
  output_format: "markdown"
  disable_images: true

# Embedding settings
embeddings:
  model: "PORTULAN/serafim-900m-portuguese-pt-sentence-encoder-ir"
  dimension: 1536
  cache_embeddings: true

# PostgreSQL vector database settings
postgresql:
  host: "localhost"
  port: "5432"
  database: "ragdb"
  user: "postgres"
  password: "postgres"
  table_name: "party_programs"

# Dependencies
dependencies:
  required:
    - psycopg2
    - sentence-transformers
    - langchain
    - ctransformers
    - markdown
    - click
    - pypdf
