# RAG system configuration. Rationale for past values lives in git history.

paths:
  raw_data: "data/0_raw"
  markdown_data: "data/1_markdown"
  processed_data: "data/2_processed"

# Changing `model` changes the vector dimension: reindex with `--drop`.
#   Qwen/Qwen3-Embedding-0.6B ...... 1024 dims, 32k ctx (current)
#   PORTULAN/serafim-900m-...-ir ... 1536 dims, 128 ctx (truncated 63% of the corpus)
embeddings:
  model: "Qwen/Qwen3-Embedding-0.6B"
  # Leave unset: a cap below the chunk budget truncates silently. Only for ablations.
  # max_seq_length: 512

postgresql:
  host: "localhost"
  port: "5432"
  database: "ragdb"
  user: "postgres"
  password: "postgres"
  table_name: "party_programs"

# OpenRouter; key in OPENROUTER_API_KEY.
llm:
  openrouter:
    model: "google/gemma-4-26b-a4b-it"
    # Tried in order when a model errors; the one that answered is recorded per run.
    fallback_models:
      - "google/gemma-4-31b-it:free"
      - "nvidia/nemotron-3-ultra-550b-a55b:free"
      - "nvidia/nemotron-3.5-lightning:free"
    # Provider choice: unset leans cheapest (a ~50 tok/s provider for Gemma),
    # "throughput" the fastest (~300 tok/s, ~40% dearer), "price" the cheapest.
    provider_sort: "throughput"
    # Results injected per call when a variant searches the web (RetrievalConfig.web_search).
    web_max_results: 5
    temperature: 0.0 # analysis and expansion are 0 too: a rerun repeats, so a delta is the change
    max_tokens: 3000 # cap on the generated answer
    # Context budget per generation prompt; the lowest-ranked chunks are trimmed
    # first, never a whole party. An 8-party comparison needs ~14-24k.
    max_prompt_tokens: 32000
    max_retries: 3
    base_backoff_secs: 1.0
    max_backoff_secs: 30.0

retrieval:
  multi_query_count: 4 # expanded queries
  rrf_k: 60
  # Results handed to generation (CLI: query -k), and per party on a comparison or
  # topic-exploration fan-out. 10/8 over 5/5 (with the topic filter off): recall
  # 0.77 -> 0.89, correctness recall 0.64 -> 0.74 on all 61 gold questions; the
  # 32k budget trims the excess, and 64k read no better.
  default_top_k: 10
  top_k_per_party: 8
  # Cross-encoder of the `reranked` variants; must be multilingual.
  # bge-reranker-v2-m3: 568M, 8k ctx; mmarco-mMiniLMv2-L12: 118M, 512 ctx (faster).
  reranker_model: "BAAI/bge-reranker-v2-m3"
  rerank_candidates: 30 # shortlist the reranker scores: its recall ceiling

indexing:
  # small_to_big: embed token-sized children, generate from their parent section.
  # token: token-sized chunks only. char: truncating baseline, ablations only.
  chunk_strategy: "small_to_big"
  max_chunk_tokens: 400 # embedded child
  chunk_overlap_tokens: 80
  # small_to_big: a section above this hands each child a window of its neighbours.
  max_parent_tokens: 1500
  # Table of the `contextual` variant (main.py index --contextual-headers --table ...).
  contextual_table: "party_programs_ctx"
  # The pre-contextual index the ladder's earlier rungs search (built with
  # --no-contextual-headers --no-llm-context --table ...).
  plain_table: "party_programs_plain"
  # Contextual retrieval, the default for `main.py index`: embed "party | section"
  # and an LLM-written context with each chunk, and BM25-index the context too.
  contextual_headers: true
  llm_context: true
  # `char` strategy only.
  max_chunk_size: 1600
  chunk_overlap: 200
  year: 2024
  # Off (--no-classify): chunks keep topic "outros", so topic filters and
  # topic_exploration routing do not work, and no checkpoint is written.
  use_llm_classification: true
  classification_model: "google/gemma-4-26b-a4b-it"
  classification_batch_size: 15
  classification_delay: 1.0
  classification_wait_out_attempts: 10 # per batch, before the run aborts
  cleaning_model: "google/gemma-4-26b-a4b-it" # structure pass of `main.py clean`
  # Writes each chunk's context for contextual retrieval (main.py index --llm-context).
  contextual_model: "google/gemma-4-31b-it"

evaluation:
  dataset_path: "data/eval/questions/golden.json"
  results_dir: "data/eval/results"
  reports_dir: "data/eval/reports"
  # A different family from the generator (self-preference bias), called with
  # no fallback chain, reasoning off, and the provider judge_provider_sort picks.
  judge_model: "qwen/qwen3.8-27b"
  judge_provider_sort: "price"
  judge_temperature: 0.0
  # Waits per LLM stage before a question is recorded as an error (a failed
  # judge score is omitted, never 0).
  wait_out_attempts: 5
  # Generator of the `*_strong` rungs (RQ5): a frontier model from a third
  # family, so neither the judge nor the production generator scores its kin.
  # Closed-book prompts are tiny; `current_strong` reads the full context.
  strong_model: "openai/gpt-5.4"
  # Regular-assistant baselines (`assistant_<slug>` rungs): frontier models with
  # web search on, corpus unseen. Search is billed per call by the provider
  # (~$0.01-0.014) on top of tokens.
  assistant_models:
    gpt: "openai/gpt-6.1-sol"
    gemini: "google/gemini-4-argon"
    claude: "anthropic/claude-opus-5.5"
  variants: ["naive", "dense_only", "hybrid", "current"]
