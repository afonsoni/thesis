# Main configuration file for the RAG system

# Data paths
paths:
  raw_data: "data/0_raw"
  markdown_data: "data/1_markdown"
  processed_data: "data/2_processed"

# PDF extraction settings
pdf_extraction:
  tool: "marker"
  output_format: "markdown"
  disable_images: true

# Embedding settings
#
# Retrieval-trained, asymmetric (instruction prefix on queries, none on
# documents — Embedder applies these automatically) and a 32k context window, so
# the encoder is no longer what limits chunk size.
#
# Replaced serafim-900m, which was a *sentence* encoder: excellent at STS but
# capped at 128 tokens, which silently truncated 63% of the corpus. Its weak
# retrieval was the same fact seen twice — it was built for short symmetric
# sentence similarity, not asymmetric passage retrieval.
#
# Changing `model` changes `dimension`, and pgvector cannot alter a VECTOR(n)
# column in place: reindex with `--drop`.
#   Qwen/Qwen3-Embedding-0.6B ............ 1024 dims,  32768 ctx
#   Alibaba-NLP/gte-multilingual-base .... 768 dims,    8192 ctx
#   PORTULAN/serafim-900m-...-ir ......... 1536 dims,    128 ctx  (previous)
embeddings:
  model: "Qwen/Qwen3-Embedding-0.6B"
  dimension: 1024
  # Optional hard cap on the encoder's context window. Deliberately unset: a cap
  # below the chunk budget truncates silently, which is the bug this replaced.
  # Set it only to *reduce* the window on purpose, e.g. to ablate serafim at
  # 128 vs the 512 its DeBERTa-v2 backbone actually supports.
  # max_seq_length: 512

# PostgreSQL + pgvector settings
postgresql:
  host: "localhost"
  port: "5432"
  database: "ragdb"
  user: "postgres"
  password: "postgres"
  table_name: "party_programs"

# LLM runtime transport (OpenRouter)
# API key is read from environment variables:
#   OPENROUTER_API_KEY
llm:
  openrouter:
    model: "google/gemma-4-31b-it:free"
    temperature: 0.2
    max_tokens: 1500
    max_retries: 3
    base_backoff_secs: 1.0
    max_backoff_secs: 30.0

# Retrieval settings
retrieval:
  multi_query_count: 4 # number of expanded queries (Part 5)
  rrf_k: 60 # RRF constant (Part 6)
  default_top_k: 5
  top_k_per_party: 3 # for comparison queries

# Indexing settings
indexing:
  # Windowing strategy: char | token | small_to_big
  #   char         – legacy baseline. Measures chunk size in CHARACTERS, which
  #                  overruns the encoder's token window and silently truncates.
  #                  Kept only as the ablation baseline; do not use in production.
  #   token        – measures in tokens, so every chunk fits the window.
  #   small_to_big – token-sized children are embedded, but the full parent
  #                  section is what generation reads. Best of both.
  chunk_strategy: "small_to_big"

  # Token budget for the token strategies, i.e. the size of the *embedded child*.
  # No longer pinned to the encoder's window — Qwen3 allows 32k — so this is now a
  # free retrieval-granularity choice: small enough that a chunk's embedding stays
  # about one thing, large enough to be self-contained. 400 keeps the chunk count
  # (and so the classification cost) close to the original character-based run,
  # while generation still receives the whole parent section.
  max_chunk_tokens: 400
  chunk_overlap_tokens: 80

  # Character budget, used ONLY by the `char` baseline strategy. These are the
  # values that produced the 62.7%-truncation baseline.
  max_chunk_size: 1600
  chunk_overlap: 200
  year: 2024

  # Run LLM topic classification during indexing (CLI override: --no-classify).
  # Token-sized chunking multiplied the chunk count ~4.5x (AD: 710 → 3163), so a
  # full classified index is now ~200 rate-limited OpenRouter requests per party.
  # Set to false to index without spending that quota when testing retrieval
  # changes; chunks then keep their default `["outros"]` topic, so topic
  # filtering and topic_exploration routing will NOT work on such an index, and
  # no classified checkpoint is written.
  use_llm_classification: true
  generate_summaries: false # multi-representation indexing (Part 12)
  classification_model: "google/gemma-4-31b-it:free"
  classification_batch_size: 15
  classification_delay: 1.0

# Evaluation settings
# NOTE: judge_model should be a KNOWN-GOOD OpenRouter id and, ideally, different
# from the generation model above to reduce self-preference bias. Verify the
# model ids in this file resolve on OpenRouter before a live run.
evaluation:
  dataset_path: "data/eval/questions/golden.json"
  results_dir: "data/eval/results"
  reports_dir: "data/eval/reports"
  judge_model: "google/gemma-4-31b-it:free"
  judge_temperature: 0.0
  sample_size: 60
  top_k: 5
  variants: ["naive", "current", "hybrid"]
